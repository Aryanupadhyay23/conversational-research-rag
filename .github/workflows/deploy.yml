name: Research Paper RAG Production Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      execute_pipeline:
        description: "Authorize CI/CD and Deployments?"
        type: boolean
        required: true
        default: true
      enable_aws:
        description: "Deploy to AWS (ECR/S3/CodeDeploy)?"
        type: boolean
        required: true
        default: true

# Ensure only one deployment runs at a time per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Master pipeline execution permission toggle
  EXECUTE_PIPELINE: "true"

  # AWS platform deployment toggle
  ENABLE_AWS: "true"

  # AWS cloud resource settings
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: research-paper-rag
  S3_DEPLOYMENT_BUCKET: research-paper-rag-deployments
  CODEDEPLOY_APPLICATION_NAME: research-paper-rag-app
  CODEDEPLOY_DEPLOYMENT_GROUP: research-paper-rag-group

jobs:
  # Verify pipeline permission and deployment target
  verify-permission:
    name: Verify Execution Permission
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gatekeeper.outputs.authorized }}
      deploy_aws: ${{ steps.gatekeeper.outputs.deploy_aws }}
    steps:
      - name: Evaluate Permission
        id: gatekeeper
        run: |
          # Evaluate master pipeline permission
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.execute_pipeline }}" = "true" ]; then
              echo "authorized=true" >> $GITHUB_OUTPUT
              echo "Pipeline execution AUTHORIZED by manual trigger."
            else
              echo "authorized=false" >> $GITHUB_OUTPUT
              echo "Pipeline execution BLOCKED by manual input."
            fi
          elif [ "${{ env.EXECUTE_PIPELINE }}" = "true" ]; then
            echo "authorized=true" >> $GITHUB_OUTPUT
            echo "Pipeline execution AUTHORIZED by push."
          else
            echo "authorized=false" >> $GITHUB_OUTPUT
            echo "Pipeline execution BLOCKED (EXECUTE_PIPELINE is '${{ env.EXECUTE_PIPELINE }}')."
            echo "Set EXECUTE_PIPELINE: 'true' in deploy.yml to enable."
          fi

          # Evaluate AWS target
          if [ "${{ env.ENABLE_AWS }}" = "true" ] && [ "${{ inputs.enable_aws }}" != "false" ]; then
            echo "deploy_aws=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_aws=false" >> $GITHUB_OUTPUT
          fi

  # CI code quality validation and smoke tests
  ci:
    name: CI - Code Validation and Smoke Tests
    needs: verify-permission
    if: needs.verify-permission.outputs.authorized == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r requirements.txt

      - name: Lint Critical Syntax Errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Python Compilation
        run: |
          python -c "
          import py_compile, os
          count = 0
          for root, _, files in os.walk('.'):
              if any(p in root for p in ['.git', '__pycache__', '.venv']): continue
              for f in files:
                  if f.endswith('.py'):
                      py_compile.compile(os.path.join(root, f), doraise=True)
                      count += 1
          print(f'Successfully compiled {count} Python files with zero syntax errors.')
          "

      - name: Run Core Module Smoke Test
        run: |
          python -c "
          from backend.services import AgentService
          from backend.schemas.state import GraphState
          from backend.utils.helpers import extract_sources_metadata
          service = AgentService()
          assert service.graph is not None
          print('Core Research Paper RAG and LangGraph smoke test passed.')
          "

  # CD build container, push to ECR, package bundle, and deploy to EC2
  deploy-aws:
    name: CD - Deploy to AWS (ECR and EC2)
    needs: [verify-permission, ci]
    if: needs.verify-permission.outputs.authorized == 'true' && needs.verify-permission.outputs.deploy_aws == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Image Health Check
        run: |
          cleanup() { docker rm -f test_container >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          echo "Starting container for pre-push health check validation..."
          docker run -d --name test_container \
            -p 8001:8000 \
            -p 8502:7860 \
            -e GOOGLE_API_KEY_ONE=AQ.pre_push_healthcheck_mock_key_001 \
            -e EMBEDDING_MODEL_KEY=mock_embedding_key \
            app:${{ github.sha }}

          echo "Polling container health endpoints (FastAPI & Streamlit) for up to 60 seconds..."
          healthy=false
          for i in {1..30}; do
            sleep 2

            # 1. Probe FastAPI Backend Health
            backend_ok=false
            if curl -sf http://localhost:8001/health | grep -q "healthy" || \
               curl -sf http://localhost:8001/research-rag-backend/health | grep -q "healthy"; then
              backend_ok=true
            fi

            # 2. Probe Streamlit Frontend Health
            frontend_ok=false
            if curl -sf http://localhost:8502/_stcore/health >/dev/null 2>&1 || \
               curl -sf http://localhost:8502/ >/dev/null 2>&1; then
              frontend_ok=true
            fi

            # 3. Check Docker native healthcheck status
            docker_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' test_container)

            if [ "$backend_ok" = true ] && [ "$frontend_ok" = true ]; then
              echo "Pre-push health checks PASSED at attempt $i (FastAPI & Streamlit online, Docker health: $docker_status)."
              healthy=true
              break
            fi
            echo "Attempt $i/30: backend_ok=$backend_ok, frontend_ok=$frontend_ok, docker_status=$docker_status"
          done

          if [ "$healthy" = false ]; then
            echo "Container health check failed before pushing to ECR!" >&2
            docker logs --tail 200 test_container >&2 || true
            exit 1
          fi

      - name: Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag app:${{ github.sha }} $ECR_REGISTRY/research-paper-rag:${{ github.sha }}
          docker tag app:${{ github.sha }} $ECR_REGISTRY/research-paper-rag:latest

          docker push $ECR_REGISTRY/research-paper-rag:${{ github.sha }}
          docker push $ECR_REGISTRY/research-paper-rag:latest
          echo "Pushed image tags to ECR: ${{ github.sha }} and latest"

      - name: Package CodeDeploy Bundle
        run: |
          chmod +x deploy/scripts/*.sh
          zip -r deployment.zip \
            appspec.yml \
            deploy/scripts/install_dependencies.sh \
            deploy/scripts/stop_docker.sh \
            deploy/scripts/start_docker.sh \
            deploy/scripts/validate_service.sh

      - name: Upload Deployment Artifact to S3
        run: |
          aws s3 cp deployment.zip s3://research-paper-rag-deployments/deployment.zip

      - name: Trigger AWS CodeDeploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name research-paper-rag-app \
            --deployment-group-name research-paper-rag-group \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=research-paper-rag-deployments,key=deployment.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --region ap-southeast-2 \
            --query "deploymentId" \
            --output text)
          echo "AWS CodeDeploy deployment triggered successfully. Deployment ID: $DEPLOYMENT_ID"
