name: Keep Hugging Face Space Alive

on:
  schedule:
    # Runs every 24 hours at midnight UTC within the 48-hour inactivity window
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-ping
  cancel-in-progress: true

jobs:
  ping-space:
    name: Ping Hugging Face Space
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Heartbeat Ping
        run: |
          SPACE_URL="https://aryan2301-conversational-pdf-rag.hf.space"
          REPO_URL="https://huggingface.co/spaces/Aryan2301/Conversational_PDF_RAG"

          echo "Sending 24-hour keep-alive ping to Hugging Face Space: $SPACE_URL..."

          # Ping Streamlit official health endpoint on port 7860
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$SPACE_URL/_stcore/health" || echo "failed")
          echo "Streamlit health status: $HTTP_STATUS"

          # Ping space direct url and public space page
          curl -s -L -f -o /dev/null "$SPACE_URL" || true
          curl -s -L -f -o /dev/null "$REPO_URL" || true

          echo "Keep-alive ping completed. Inactivity timer reset."
