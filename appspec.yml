version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/app
hooks:
  BeforeInstall:
    - location: deploy/scripts/stop_docker.sh
      timeout: 120
      runas: root
    - location: deploy/scripts/install_dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: deploy/scripts/start_docker.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: deploy/scripts/validate_service.sh
      timeout: 300
      runas: root
